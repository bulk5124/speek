<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Speek — Push-to-Talk." />
  <title>Speek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Speek</h1>
    </div>
  </header>

  <main>
    <section class="join-panel" id="joinPanel">
      <!-- Hook for lobby/space UI (firm lobby agents). Keep id stable. -->
      <div id="lobbySlot" class="ext-slot" hidden></div>

      <label class="field">
        <span>Name</span>
        <input id="nameInput" type="text" maxlength="40" autocomplete="nickname" placeholder="Name" />
      </label>

      <label class="field" id="roomField">
        <span>Raumcode</span>
        <div class="room-row">
          <input id="roomInput" type="text" maxlength="8" autocomplete="off" spellcheck="false" placeholder="KATZE7" inputmode="text" />
          <button type="button" class="btn secondary" id="genRoomBtn" title="Neuen Code erzeugen">Neu</button>
        </div>
      </label>

      <!-- Hook for pairing/QR UI. Keep id stable. -->
      <div id="pairingSlot" class="ext-slot" hidden></div>

      <fieldset class="mode-field">
        <legend>Modus</legend>
        <label class="mode-option">
          <input type="radio" name="mode" value="one" checked />
          <span><strong>1:1</strong></span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="group" />
          <span><strong>Gruppe</strong></span>
        </label>
      </fieldset>

      <button type="button" class="btn primary" id="joinBtn">Beitreten</button>
      <p class="hint" id="joinHint"></p>
    </section>

    <section class="session hidden" id="sessionPanel">
      <div class="you-row">
        <div>
          <p class="eyebrow">Raum <span id="roomLabel">—</span></p>
          <p class="you-name" id="youName">—</p>
          <p class="mode-chip" id="modeChip">1:1</p>
        </div>
        <p class="status-pill" id="connStatus">Verbinde…</p>
      </div>

      <div class="peers-head">
        <h2 id="peersHeading">Im Raum</h2>
        <span class="count" id="peerCount">0</span>
      </div>
      <ul class="peer-list" id="peerList"></ul>
      <p class="empty" id="emptyPeers">Warte auf andere…</p>

      <div class="talk-dock hidden" id="talkDock">
        <p class="talk-target" id="talkTarget">Bereit</p>
        <button type="button" class="ptt" id="pttBtn" aria-pressed="false">
          <span class="ptt-label">Halten &amp; speeken</span>
        </button>
        <button type="button" class="btn ghost" id="leaveTalkBtn">Zurück</button>
        <p class="talk-hint" id="talkHint"></p>
      </div>

      <button type="button" class="btn ghost leave-room" id="leaveRoomBtn">Verlassen</button>
    </section>
  </main>

  <script src="./vendor/peerjs.min.js"></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
